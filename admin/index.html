<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN - GOBEX | Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@600;700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{background:linear-gradient(135deg,#0A2F5E 0%,#143d75 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Roboto}
.login-card{background:#fff;border-radius:20px;padding:40px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.logo{font-family:Exo;font-weight:800;font-size:32px;color:#0A2F5E;letter-spacing:-1px}
.btn-main{background:#FFB81C;color:#0A2F5E;font-weight:700;border-radius:50px;padding:12px 28px;border:2px solid #FFB81C;width:100%}
.btn-main:hover{background:#e6a517;border-color:#e6a517;color:#0A2F5E}
.form-control{height:50px;border-radius:12px}
</style>
</head>
<body>
<div class="login-card">
<div class="text-center mb-4">
<div class="logo">GOBEX</div>
<div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#6f8ba4;font-weight:700;">Godwin Business Expertise</div>
<h4 class="mt-4" style="font-family:Exo;font-weight:700;color:#0A2F5E;">Espace Administrateur</h4>
<p class="small text-muted">Accès réservé à l'administrateur du site</p>
</div>
<form id="loginForm">
<div class="mb-3"><label class="form-label small fw-bold">Identifiant</label><input type="text" id="username" class="form-control" placeholder="admin" required value="admin"></div>
<div class="mb-3"><label class="form-label small fw-bold">Mot de passe</label><input type="password" id="password" class="form-control" placeholder="••••••••" required></div>
<div class="mb-3 form-check"><input type="checkbox" class="form-check-input" id="remember"><label class="form-check-label small">Se souvenir de moi</label></div>
<button type="submit" class="btn btn-main"><i class="bi bi-box-arrow-in-right me-2"></i>Se connecter</button>
<div id="error" class="alert alert-danger mt-3 d-none small"></div>
</form>
<div class="mt-4 p-3 bg-light rounded-3">
<p class="small mb-1"><strong>Démo :</strong></p>
<p class="small mb-0 text-muted">User: <code>admin</code><br>Pass: <code>GOBEX2025</code> ou <code>admin123</code></p>
</div>
<div class="text-center mt-4"><a href="../index.html" class="small text-muted"><i class="bi bi-arrow-left me-1"></i>Retour au site</a></div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value.trim();
  const error = document.getElementById('error');
  // Simple auth - à remplacer par vrai backend en production
  const validUsers = [
    {u:'admin', p:'GOBEX2025'},
    {u:'admin', p:'admin123'},
    {u:'godwin', p:'GOBEX2025'},
    {u:'gobex', p:'gobex2025'}
  ];
  const isValid = validUsers.some(v => v.u===user && v.p===pass);
  if(isValid){
    localStorage.setItem('gobex_admin_auth', 'true');
    localStorage.setItem('gobex_admin_user', user);
    localStorage.setItem('gobex_admin_login_time', new Date().toISOString());
    window.location.href = 'dashboard.html';
  } else {
    error.textContent = 'Identifiants incorrects. Essayez admin / GOBEX2025';
    error.classList.remove('d-none');
    setTimeout(()=>error.classList.add('d-none'), 4000);
  }
});
// Auto redirect if already logged
if(localStorage.getItem('gobex_admin_auth')==='true'){
  window.location.href='dashboard.html';
}
</script>
</body>
</html>
