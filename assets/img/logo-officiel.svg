<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- GOBEX Official Logo - Reconstructed from original -->
  <!-- Colors from original: Yellow #FFB81C, Dark Blue #0A2F5E -->
  <g>
    <!-- Yellow top part -->
